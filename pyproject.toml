[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mille-feuilles"
version = "0.2.0"
description = "Reproducible synthetic historical newspaper pages with geometric ground truth"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=12.3,<13",
  "fonttools>=4.60,<5",
  "jsonschema>=4.25,<5",
  "lxml>=6,<7",
  "numpy>=2.3,<3",
  "shapely>=2.1,<3",
]

[project.scripts]
mille-feuilles = "mille_feuilles.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/mille_feuilles"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
